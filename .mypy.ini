[mypy]
python_version = 3.13
strict = true

exclude =
    .*migrations.*
    .*\.github/.*
    .*\.idea/.*
    .*\.venv/.*
    .*docs/.*
    .*templates/.*
    .*__pycache__.*


plugins =
    mypy_django_plugin.main,
    mypy_drf_plugin.main

[mypy.plugins.django-stubs]
django_settings_module = "wselfedu.settings"