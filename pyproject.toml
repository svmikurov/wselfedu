[project]
name = "wse"
version = "0.1.0"
description = "WSE project"
authors = [
    { name = "Sergei Mikurov", email = "454004@mail.ru" },
]
readme = "README.md"
requires-python = ">=3.13,<4.0"

dependencies = [
    "dependency-injector>=4.49.0,<5.0.0",
    "django>=6.1,<7.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
]

[tool.poetry]
packages = [{include = "wse", from = "src"}]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.15.15,<0.16.0",
    "mypy>=2.1.0,<3.0.0",
    "playwright>=1.60.0,<2.0.0",
    "pytest-django>=4.12.0,<5.0.0",
    "django-stubs>=6.1,<7.0",
]
docs = [
    "sphinx>=9.1.0,<10.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"