{# Header block component with header name and back button #}

{% load i18n %}

<div id="header-block" class="row py-3">
    {# Page header #}
    <div class="col">
      <h1>{{ header }}</h1>
    </div>
    {# Back button #}
    <div class="col-auto">
      <a href="javascript:history.back()" class="wse-btn">
        {% trans 'button.back' %}
      </a>
    </div>
  </div>
