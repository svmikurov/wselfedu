services:
  wse-postgres:
    image: wse-postgres:dev
    build:
      context: ./docker/db/postgres/
      dockerfile: Dockerfile
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .envs/db
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/database-password
    secrets:
      - database-password
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  wse-django-admin:
    image: wse-django-admin:dev
    build:
      context: .
      dockerfile: ./docker/db/django_orm/Dockerfile
    env_file:
      - .envs/app
    environment:
      - DATABASE_PASSWORD_FILE=/run/secrets/database-password
    secrets:
      - database-password
    ports:
      - "8000:8000"
    networks:
      - internal
    volumes:
      - ./src/wse/infrastructure/db/django_orm:/app
    depends_on:
      wse-postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:

secrets:
  database-password:
    file: ./secrets/database-password